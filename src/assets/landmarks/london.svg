<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Tower Body -->
  <rect x="330" y="220" width="140" height="340" fill="#d97706"/>
  <rect x="350" y="240" width="20" height="320" fill="#b45309"/>
  <rect x="390" y="240" width="20" height="320" fill="#b45309"/>
  <rect x="430" y="240" width="20" height="320" fill="#b45309"/>
  <!-- Clock Section -->
  <rect x="310" y="140" width="180" height="80" fill="#b45309"/>
  <circle cx="400" cy="180" r="32" fill="#fef3c7" stroke="#78350f" stroke-width="6"/>
  <!-- Clock Hands -->
  <line x1="400" y1="180" x2="400" y2="160" stroke="#000" stroke-width="4"/>
  <line x1="400" y1="180" x2="415" y2="180" stroke="#000" stroke-width="3"/>
  <!-- Belfry & Spire -->
  <rect x="330" y="90" width="140" height="50" fill="#78350f"/>
  <polygon points="330,90 400,10 470,90" fill="#451a03"/>
</svg>
